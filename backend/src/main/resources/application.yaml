spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: prospectsoul-backend

  # Load the repository-root .env when running from backend/ (mvn spring-boot:run)
  # or from the repository root, so the ports and credentials Docker Compose
  # uses apply without exporting anything by hand. Optional: real environment
  # variables win, and the defaults below apply when no .env exists.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/prospectsoul}
    username: ${DATABASE_USERNAME:prospectsoul}
    password: ${DATABASE_PASSWORD:prospectsoul}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate must never generate DDL.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/vyoog}

  # The Spring AI OpenAI starter is on the classpath and requires a credential
  # at start-up. No AI feature is wired yet; supply OPENAI_API_KEY only when
  # that work begins.
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

keycloak:
  admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8081}
    realm: master
    client-id: admin-cli
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  target-realm: ${KEYCLOAK_TARGET_REALM:vyoog}

prospectsoul:
  security:
    client-id: ${KEYCLOAK_CLIENT_ID:prospectsoul-web}
  cors:
    # Comma-separated list; never widen this to "*" outside development.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:prospectsoul}
    secret-key: ${MINIO_SECRET_KEY:prospectsoul}
    bucket: ${MINIO_BUCKET:prospectsoul}

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
