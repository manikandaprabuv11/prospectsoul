spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: prospectsoul-backend

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}

  # Load the repository-root .env when running from backend/ (mvn spring-boot:run)
  # or from the repository root, so the ports and credentials Docker Compose
  # uses apply without exporting anything by hand. Optional: real environment
  # variables win, and the defaults below apply when no .env exists.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/prospectsoul}
    username: ${DATABASE_USERNAME:prospectsoul}
    password: ${DATABASE_PASSWORD:prospectsoul}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate must never generate DDL.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/vyoog}

  # The Spring AI OpenAI starter is on the classpath and requires a credential
  # at start-up. No AI feature is wired yet; supply OPENAI_API_KEY only when
  # that work begins.
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

keycloak:
  admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8081}
    realm: master
    client-id: admin-cli
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  target-realm: ${KEYCLOAK_TARGET_REALM:vyoog}

prospectsoul:
  security:
    client-id: ${KEYCLOAK_CLIENT_ID:prospectsoul-web}
  cors:
    # Comma-separated list; never widen this to "*" outside development.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # External places lookup for the map screen (docs 21 §7). By default the
  # backend uses the free OpenStreetMap Overpass API — no key required.
  # Set GOOGLE_PLACES_API_KEY in the environment to switch to Google
  # Places automatically (the frontend never sees this key). Set
  # `prospectsoul.places.provider=stub` to force the deterministic stub
  # provider used in tests.

  # Pincode resolver — cache-first (pincode_centroids), external geocoder
  # on miss (India Post + OpenStreetMap Nominatim by default). Override
  # `geocoder` to disable the network path in a locked-down environment.
  pincode:
    geocoder: ${PINCODE_GEOCODER:india_post_nominatim}
    postalpincode-url: ${POSTALPINCODE_URL:https://api.postalpincode.in/pincode}
    nominatim-url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org/search}
    timeout-seconds: ${PINCODE_TIMEOUT_SECONDS:15}
    user-agent: ${PINCODE_USER_AGENT:ProspectSoul/1.0 (contact@vyoog.com)}

  places:
    provider: ${PLACES_PROVIDER:overpass}
    google-api-key: ${GOOGLE_PLACES_API_KEY:}
    overpass-url: ${OVERPASS_URL:https://overpass-api.de/api/interpreter}
    overpass-timeout-seconds: ${OVERPASS_TIMEOUT_SECONDS:20}
    max-results: ${PLACES_MAX_RESULTS:30}
    daily-quota: ${PLACES_DAILY_QUOTA:5000}
    default-radius-m: ${PLACES_DEFAULT_RADIUS_M:3000}

  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:prospectsoul}
    secret-key: ${MINIO_SECRET_KEY:prospectsoul}
    bucket: ${MINIO_BUCKET:prospectsoul}

  # Company phone verification (docs/dev_docs/14 §16). The worker is a
  # DB-backed queue over verification_batch_items; no message broker.
  verification:
    worker-enabled: ${VERIFICATION_WORKER_ENABLED:true}
    poll-interval-ms: ${VERIFICATION_POLL_INTERVAL_MS:5000}
    batch-size: ${VERIFICATION_BATCH_SIZE:10}
    max-retries: ${VERIFICATION_MAX_RETRIES:3}
    provider: ${VERIFICATION_PROVIDER:twilio}
    max-batch-companies: ${VERIFICATION_MAX_BATCH_COMPANIES:1000}
    # How long an item may sit in PROCESSING before the worker treats it as
    # abandoned by a dead JVM and returns it to the queue.
    stale-item-timeout-ms: ${VERIFICATION_STALE_ITEM_TIMEOUT_MS:300000}
    # Dialling code prefixed to a normalized 10-digit national number to build
    # the E.164 form Twilio Lookup requires.
    default-country-code: ${VERIFICATION_DEFAULT_COUNTRY_CODE:+91}

    # Twilio Lookup v2 credentials. Environment only — never commit a real
    # value, never expose one to the frontend, and treat any credential that
    # has been pasted into a conversation or a sample as compromised and
    # rotate it before production use. With no credentials configured, every
    # item fails permanently with PROVIDER_NOT_CONFIGURED, which is visible on
    # the item rather than hidden in a log.
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      lookup-base-url: ${TWILIO_LOOKUP_BASE_URL:https://lookups.twilio.com}
      connect-timeout-ms: ${TWILIO_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${TWILIO_READ_TIMEOUT_MS:10000}

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
