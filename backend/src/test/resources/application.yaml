# Test overrides. The datasource is supplied by Testcontainers via
# @ServiceConnection, so only the settings that would otherwise reach out to
# external infrastructure are pinned here.
spring:
  profiles:
    active: test
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri takes precedence over issuer-uri and is resolved lazily,
          # so the context loads without a running Keycloak.
          jwk-set-uri: http://localhost:8081/realms/vyoog/protocol/openid-connect/certs

  ai:
    openai:
      api-key: test-key-not-used

keycloak:
  admin:
    server-url: http://localhost:8081
    realm: master
    client-id: admin-cli
    username: admin
    password: admin
  target-realm: vyoog

prospectsoul:
  verification:
    # The scheduled poll is off in tests: the worker is driven explicitly with
    # runOnce() so each assertion happens at a known point, instead of racing a
    # background thread.
    worker-enabled: false
    poll-interval-ms: 3600000
    batch-size: 10
    max-retries: 3
    # The real provider bean is wired (so every test context has a
    # PhoneVerificationProvider), but no TWILIO_* credentials are set here, so
    # TwilioPhoneVerificationProvider short-circuits to
    # PROVIDER_NOT_CONFIGURED before it opens a connection. No test can reach
    # Twilio. Verification tests additionally override the bean with
    # StubPhoneVerificationProvider via VerificationTestConfiguration.
    provider: twilio
    twilio:
      account-sid: ""
      auth-token: ""
      lookup-base-url: http://localhost:1/unused
    default-country-code: "+91"
    stale-item-timeout-ms: 1000
